<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Fumes – Bank connection</title>
<style>
  :root { --bg:#ffffff; --text:#1d1d1f; --muted:#5f6368; --box:#f2f2f2; --ok:#639922; --err:#E24B4A; }
  @media (prefers-color-scheme: dark) { :root { --bg:#121212; --text:#ececec; --muted:#a0a0a0; --box:#1f1f1f; } }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width:560px; margin:0 auto; padding:48px 16px; }
  h1 { font-size:24px; margin:0 0 8px; }
  p { color:var(--muted); }
  code { display:block; background:var(--box); padding:12px; border-radius:8px; word-break:break-all; font-size:14px; color:var(--text); }
  button { margin-top:12px; padding:10px 18px; border:0; border-radius:8px; background:var(--ok); color:#fff; font-size:16px; cursor:pointer; }
  .err { color:var(--err); }
</style>
</head>
<body>
<main>
  <h1 id="title">Bank connection</h1>
  <p id="msg">Checking…</p>
  <code id="code" hidden></code>
  <button id="copy" hidden>Copy code</button>
</main>
<script>
  // Reads the code from the address bar and shows it. Nothing is sent anywhere.
  var q = new URLSearchParams(location.search);
  var code = q.get("code"), error = q.get("error");
  var t = document.getElementById("title"), m = document.getElementById("msg");
  var c = document.getElementById("code"), b = document.getElementById("copy");
  if (code) {
    t.textContent = "Bank connected";
    m.textContent = "Copy this code into the Fumes setup script. It works once and expires soon.";
    c.textContent = code; c.hidden = false; b.hidden = false;
    b.onclick = function () {
      navigator.clipboard.writeText(code).then(function () { b.textContent = "Copied"; });
    };
  } else if (error) {
    t.textContent = "Connection not completed";
    m.className = "err";
    m.textContent = "The bank returned: " + error + (q.get("error_description") ? " – " + q.get("error_description") : "");
  } else {
    m.textContent = "No code found. This page is used only when connecting a bank to Fumes.";
  }
</script>
</body>
</html>
